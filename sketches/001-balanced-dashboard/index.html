<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Balanced dashboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:#222;font:14px system-ui}.shell{width:min(1320px,94vw);margin:28px auto;background:#f8f5ef;border-radius:30px;min-height:820px;overflow:hidden}.top{height:78px;display:flex;align-items:center;padding:0 34px;border-bottom:1px solid #ddd8cf}.brand{font-weight:800;font-size:20px}.top button{margin-left:auto}.main{padding:26px 34px 100px}.summary{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:16px}.hero,.stat{border-radius:24px;padding:25px}.hero{background:#242823;color:white}.hero h1{font-size:38px;margin:14px 0}.hero button{background:#f46b4d;color:white}.stat{background:white;border:1px solid #ddd8cf}.library{margin-top:28px}.head{display:flex;align-items:end;justify-content:space-between}.head h2{font-size:28px;margin:4px 0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button,.top button,.hero button{border:0;border-radius:999px;padding:10px 16px}.filters .on{background:#f46b4d;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #ddd8cf;border-radius:18px;padding:18px;cursor:pointer}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0001}.card b{font-size:17px}.card p{color:#777;margin-bottom:0}.toast{position:fixed;right:30px;bottom:30px;background:#222;color:white;padding:13px 18px;border-radius:12px;display:none}</style>
<div class="shell"><header class="top"><div class="brand">T　Teclea Español</div><button>设置</button></header><main class="main"><section class="summary"><div class="hero"><small>BUENOS DÍAS</small><h1>今天练 12 个词</h1><p>继续「现在时 1」· 还剩 8 张</p><button onclick="toast('开始今日练习')">继续练习 →</button></div><div class="stat"><small>今日正确率</small><h2>96%</h2><p>错误 3 次</p></div><div class="stat"><small>连续学习</small><h2>3 天</h2><p>本周 48 张卡</p></div></section><section class="library"><div class="head"><div><small>开放词库 · 708 张卡</small><h2>选择今天要练的内容</h2></div><span>33 个课程</span></div><div class="filters"><button class="on" onclick="pick(this)">全部</button><button onclick="pick(this)">对话</button><button onclick="pick(this)">高频</button><button onclick="pick(this)">变位</button><button onclick="pick(this)">A1</button><button onclick="pick(this)">A2</button><button onclick="pick(this)">旅行</button><button onclick="pick(this)">餐厅</button></div><div class="grid"><article class="card" onclick="toast('打开：初次见面')"><b>初次见面</b><p>A1 · 对话 · 8 张</p></article><article class="card"><b>连接与问句</b><p>A1 · 高频 · 20 张</p></article><article class="card"><b>现在时 1</b><p>A1 · 变位 · 30 张</p></article><article class="card"><b>交通与旅行</b><p>A2 · 高频 · 20 张</p></article><article class="card"><b>点餐吃饭</b><p>A1 · 对话 · 8 张</p></article><article class="card"><b>过去未完成时 1</b><p>A2 · 变位 · 30 张</p></article></div></section></main></div><div class="toast" id="toast"></div><script>function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1200)}function pick(e){document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));e.classList.add('on')}</script></html>
